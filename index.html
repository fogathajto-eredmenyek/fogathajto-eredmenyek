<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fogathajtó Versenyek – Eredmények</title>

<style>
:root {
  --navy: #17365d;
  --blue: #24558a;
  --bg: #f4f6f8;
  --line: #dce3eb;
  --text: #263238;
  --gold: #d6a642;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}

/* FEJLÉC */

header {
  background: var(--navy);
  color: #fff;
  padding: 22px 16px 20px;
  text-align: center;
  border-bottom: 3px solid var(--gold);
}

#site-label {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: #dbe5f0;
  margin: 0 0 8px;
}

header h1 {
  font-size: clamp(22px, 3.5vw, 32px);
  line-height: 1.2;
  margin: 0 0 8px;
  font-weight: 750;
}

header .event-info {
  font-size: 14px;
  margin: 8px 0;
  color: #e5edf5;
}

header .live-status {
  margin: 10px 0 0;
  font-size: 13px;
  color: #e5edf5;
}

header .unofficial {
  font-weight: 700;
}

/* FŐ TARTALOM */

main {
  max-width: 1160px;
  margin: 22px auto;
  padding: 0 14px;
}

/* VERSENYARCHÍVUM */

.archive-selector {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 10px;
  flex-wrap: wrap;
  margin: 0 0 14px;
  color: var(--navy);
  font-weight: 700;
  font-size: 14px;
}

.archive-selector select {
  max-width: 100%;
  padding: 10px 12px;
  border: 1px solid #c7d3e2;
  border-radius: 7px;
  background: #fff;
  color: var(--navy);
  font: inherit;
  font-weight: 500;
}

/* EREDMÉNYLAP-FÜLEK */

.tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-start;
  margin: 12px 0 14px;
}

.tab {
  border: 1px solid #cbd5e1;
  background: #fff;
  color: var(--navy);
  padding: 10px 13px;
  border-radius: 7px;
  font-weight: 650;
  cursor: pointer;
  transition: background .15s, border-color .15s;
}

.tab:hover {
  background: #edf2f7;
  border-color: #9aafc5;
}

.tab.active {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}

button:focus-visible,
select:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 2px;
}

/* EREDMÉNYTÁBLA */

.panel {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 2px 8px #102b480d;
}

.table-wrap {
  overflow-x: auto;
  position: relative;
}

table {
  border-collapse: collapse;
  width: 100%;
  min-width: 600px;
  font-size: 14px;
}

th {
  background: #eaf0f7;
  color: var(--navy);
  text-align: center;
  font-weight: 700;
  position: sticky;
  top: 0;
  z-index: 2;
}

th,
td {
  padding: 10px 9px;
  border-bottom: 1px solid var(--line);
  text-align: center;
  white-space: nowrap;
}

tbody tr:not(.category-row):nth-child(even) td {
  background: #fafbfd;
}

tbody tr:not(.category-row):hover td {
  background: #f0f5fa;
}

td.left {
  font-weight: 650;
}

/* KATEGÓRIÁK */

.category-row td {
  background: #dce7f3;
  color: var(--navy);
  font-weight: 700;
  text-align: left;
  font-size: 15px;
  padding: 11px 12px;
}

/* ÁLLAPOTJELZÉS */

#status {
  font-size: 12px;
  color: #6b7788;
  text-align: center;
  padding: 11px;
  border-top: 1px solid #edf0f4;
}

.empty {
  text-align: center;
  padding: 30px 15px;
  color: #6b7788;
}

/* LÁBLÉC */

footer {
  text-align: center;
  color: #8993a2;
  font-size: 12px;
  padding: 22px 16px;
}

/* KÉT FORDULÓ ÖSSZETETT EREDMÉNY */

.table-wrap.combined-wrap table {
  width: max-content;
  min-width: 100%;
  font-size: 12px;
}

.table-wrap.combined-wrap th,
.table-wrap.combined-wrap td {
  padding: 7px 6px;
}

/* RÖGZÍTETT ELSŐ OSZLOP */

.table-wrap.combined-wrap th:nth-child(1),
.table-wrap.combined-wrap td:nth-child(1) {
  position: sticky;
  left: 0;
  z-index: 4;
  background: #eaf0f7;
  min-width: 48px;
}

/* RÖGZÍTETT MÁSODIK OSZLOP */

.table-wrap.combined-wrap th:nth-child(2),
.table-wrap.combined-wrap td:nth-child(2) {
  position: sticky;
  left: 48px;
  z-index: 4;
  background: #eaf0f7;
  min-width: 65px;
}

/* RÖGZÍTETT VERSENYZŐNÉV */

.table-wrap.combined-wrap th:nth-child(4),
.table-wrap.combined-wrap td:nth-child(4) {
  position: sticky;
  left: 113px;
  z-index: 4;
  background: #eaf0f7;
  min-width: 150px;
  text-align: left;
  box-shadow: 3px 0 5px #00000012;
}

/* RÖGZÍTETT FEJLÉC */

.table-wrap.combined-wrap thead th {
  z-index: 6;
}

/* KATEGÓRIA- ÉS ALFEJLÉCEK */

.table-wrap.combined-wrap .category-row th {
  background: #dce7f3 !important;
  color: var(--navy);
  font-weight: 700;
  text-align: center;
  position: static !important;
}

.table-wrap.combined-wrap .combined-subheader th {
  background: #eaf0f7 !important;
  color: var(--navy);
  font-weight: 700;
  position: static !important;
}

/* KATEGÓRIASOROK */

.table-wrap.combined-wrap .category-row td {
  position: static !important;
  background: #dce7f3 !important;
  font-size: 14px;
  padding: 9px;
}

/* MOBILNÉZET */

@media (max-width: 600px) {
  header {
    padding: 19px 12px 17px;
  }

  main {
    margin: 16px auto;
    padding: 0 9px;
  }

  #site-label {
    font-size: 10px;
    letter-spacing: .09em;
  }

  .archive-selector {
    flex-direction: column;
    align-items: stretch;
  }

  .archive-selector select {
    width: 100%;
  }

  .tabs {
    gap: 6px;
  }

  .tab {
    flex: 1 1 calc(50% - 6px);
    padding: 10px 8px;
    font-size: 12px;
  }

  table {
    font-size: 13px;
  }

  .table-wrap.combined-wrap table {
    font-size: 11px;
  }

  .table-wrap.combined-wrap th,
  .table-wrap.combined-wrap td {
    padding: 6px 5px;
  }
}
</style>
</head>

<body>

<header>

  <div id="site-label">
    Fogathajtó Versenyek – Élő eredmények
  </div>

  <h1 id="event-title">
    Fülöpi Fogathajtó Verseny
  </h1>

  <div class="event-info" id="event-info">
    📍 Fülöp &nbsp; | &nbsp; 📅 2026. 10. 28.
  </div>

  <p class="live-status">
    Élő eredmények
    <span class="unofficial">(Nem hivatalos eredmény)</span>
  </p>

</header>

<main>

<div class="archive-selector">

  <label for="competition-select">
    Korábbi verseny:
  </label>

  <select id="competition-select">
    <option>Versenyek betöltése…</option>
  </select>

</div>

<nav class="tabs" id="tabs" aria-label="Eredménylapok"></nav>

<section class="panel">

  <div id="results">
    <div class="empty">
      Az eredmények betöltése…
    </div>
  </div>

  <div id="status">
    Kapcsolódás…
  </div>

</section>

</main>

<footer>
  Az eredmények a versenyiroda adatai alapján frissülnek.
</footer>
